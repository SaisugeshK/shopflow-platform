  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate the refresh token and get a new access token
      description: "Accepts the refresh token from the body or the sf_refresh cookie.\
        \ Reusing a rotated token revokes the session. Errors: AUTH_INVALID_REFRESH_TOKEN."
      operationId: refresh
      parameters:
      - name: sf_refresh
        in: cookie
        required: false
        schema:
          type: string
      - name: X-Client-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
  /api/v1/auth/otp/verify:
    post:
      tags:
      - Authentication
      summary: Verify an OTP and sign in
      description: "On success returns access/refresh tokens for an existing account,\
        \ or registrationRequired=true with a registration token for a new number.\
        \ Web clients (X-Client-Type: web) receive the refresh token only as an HttpOnly\
        \ cookie. Errors: AUTH_INVALID_OTP, AUTH_OTP_EXPIRED, AUTH_TOO_MANY_ATTEMPTS,\
        \ AUTH_ACCOUNT_INACTIVE, CUSTOMER_BLOCKED, CUSTOMER_NOT_APPROVED."
      operationId: verifyOtp
      parameters:
      - name: X-Client-Type
        in: header
        description: Send 'web' from browsers
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
  /api/v1/auth/otp/request:
    post:
      tags:
      - Authentication
      summary: Request an OTP
      description: "Normalises the mobile number, applies rate limits and the resend\
        \ cooldown, invalidates older OTPs and sends a new one. The response never\
        \ reveals whether an account exists. Errors: VALIDATION_ERROR, AUTH_OTP_COOLDOWN,\
        \ RATE_LIMITED, AUTH_OTP_DELIVERY_FAILED."
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOtpRequestResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: "Revokes the current session (from the access token, refresh token\
        \ body or cookie)."
      operationId: logout
      parameters:
      - name: sf_refresh
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
