openapi: 3.1.0
info:
  title: ShopFlow Platform API
  description: |
    REST API for the wholesale/retail shop management platform (React web and React Native clients).

    * Authentication: mobile number + OTP → short-lived bearer access token (JWT) plus a rotating refresh token.
    * Authorization: role (OWNER, ADMIN, CUSTOMER) plus permission codes; customers can only access their own data.
    * Envelope: every JSON response is `{ success, data, message, pagination?, error?, requestId }`.
    * Errors: `error.code` is one of the documented business codes (e.g. INSUFFICIENT_STOCK, CREDIT_LIMIT_EXCEEDED).
    * Money: decimal numbers with 2 places, calculated only by the backend.
    * Lists: `page` (1-based), `pageSize` (max 100), `sort=field,asc|desc`.
    * Retries: send `Idempotency-Key` on order creation, payment recording, invoice generation and WhatsApp sends.
  version: v1
servers:
- url: /
  description: Current host
tags:
- name: Categories
  description: Product categories and brands
- name: Users
  description: Owner/Admin staff accounts and permissions
- name: Audit
  description: Immutable audit trail
- name: Dev Tools
  description: "Development-only helpers for mock OTP, payment and WhatsApp providers"
- name: Invoices
  description: "Order-based and admin-created tax invoices, PDF, WhatsApp delivery\
    \ and credit notes"
- name: Customer Pricing
  description: Customer-specific product prices
- name: Products
  description: Product master data (staff)
- name: Files
  description: Public product images and logo
- name: Sales Returns
  description: "Customer return requests, review and credit notes"
- name: Integrations
  description: Provider callbacks
- name: Cart
  description: The signed-in customer's cart; totals are recalculated by the backend
- name: Orders
  description: "Checkout, order status workflow, delivery and cancellation"
- name: Purchases
  description: "Purchases, supplier payments and purchase returns"
- name: Dashboard
  description: "Owner, Admin and Customer dashboards"
- name: Stock
  description: "Stock balances, movements, adjustments and low-stock"
- name: Suppliers
  description: Supplier master data and supplier ledger
- name: Payments
  description: "Payment recording, online payment verification, refunds, receipts\
    \ and gateway webhooks"
- name: Notifications
  description: In-app notifications for the signed-in user
- name: Authentication
  description: "Mobile number + OTP sign-in, token refresh and logout"
- name: Business Settings
  description: "Business profile, invoice/tax settings, bank accounts and operational\
    \ rules"
- name: Catalog
  description: Customer product browsing with customer-specific prices
- name: Customer Registration
  description: Self-registration for new customers after OTP verification
- name: Customers
  description: "Customer management, approval, credit and ledger"
- name: Reports
  description: "Sales, purchase, stock, profit, GST/tax, customer, outstanding and\
    \ payment reports with CSV/Excel/PDF export"
- name: My Account
  description: "Customer self-service: business profile, addresses, statement and\
    \ outstanding"
paths:
  /api/v1/users/{id}/permissions:
    put:
      tags:
      - Users
      summary: Replace a user's extra permissions
      description: Grants on top of the role's permissions. Takes effect on the user's
        next token refresh.
      operationId: setPermissions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPermissionsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListString"
      security:
      - bearerAuth: []
  /api/v1/customers/{customerId}/prices/{productId}:
    put:
      tags:
      - Customer Pricing
      summary: Set a customer's price for a product
      description: Applies to new orders and invoices only.
      operationId: set
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPriceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerPriceResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Customer Pricing
      summary: Remove a customer's special price
      description: The product's default selling price applies again.
      operationId: remove
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security:
      - bearerAuth: []
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List staff users
      description: Owner and Admin accounts. Requires USER_MANAGE.
      operationId: list
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - BLOCKED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListUserResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Users
      summary: Create an Admin user
      description: Owner accounts cannot be created through the API.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/v1/users/{id}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate a staff user
      description: Revokes all of the user's sessions immediately.
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/v1/users/{id}/activate:
    post:
      tags:
      - Users
      summary: Activate a staff user
      operationId: activate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/v1/suppliers:
    get:
      tags:
      - Suppliers
      summary: Search suppliers
      description: "Sort: name, supplierCode, createdAt."
      operationId: list_1
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListSupplierResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Suppliers
      summary: Create a supplier
      description: Supplier code is generated.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSupplierResponse"
      security:
      - bearerAuth: []
  /api/v1/stock/adjustments:
    post:
      tags:
      - Stock
      summary: Adjust stock
      description: "Records ADJUSTMENT_IN, ADJUSTMENT_OUT, DAMAGE_OUT or LOSS_OUT\
        \ with a mandatory reason. Errors: INSUFFICIENT_STOCK."
      operationId: adjust
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdjustmentResponse"
      security:
      - bearerAuth: []
  /api/v1/sales-returns:
    get:
      tags:
      - Sales Returns
      summary: List sales returns
      description: Customers see only their own.
      operationId: list_2
      parameters:
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - REJECTED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListSalesReturnResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Sales Returns
      summary: Request a return
      description: "Against a generated invoice of a delivered order. Quantities cannot\
        \ exceed what is still returnable. Errors: RETURN_INVALID_QUANTITY, RETURN_INVALID_STATUS."
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesReturnRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSalesReturnResponse"
      security:
      - bearerAuth: []
  /api/v1/sales-returns/{id}/reject:
    post:
      tags:
      - Sales Returns
      summary: Reject a return
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSalesReturnResponse"
      security:
      - bearerAuth: []
  /api/v1/sales-returns/{id}/approve:
    post:
      tags:
      - Sales Returns
      summary: Approve a return
      description: "Stock IN, SALES_RETURN credit note and customer ledger credit,\
        \ atomically."
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSalesReturnResponse"
      security:
      - bearerAuth: []
  /api/v1/purchases:
    get:
      tags:
      - Purchases
      summary: Search purchases
      description: "Filter by text (purchase/supplier invoice number), supplier, status\
        \ and date range. Sort: purchaseDate, purchaseNumber, grandTotal."
      operationId: list_3
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - POSTED
          - CANCELLED
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListPurchaseResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Purchases
      summary: Create a purchase
      description: Totals and GST are calculated by the backend. Set post=true to
        post immediately (stock IN + supplier ledger).
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseResponse"
      security:
      - bearerAuth: []
  /api/v1/purchases/{id}/post:
    post:
      tags:
      - Purchases
      summary: Post a draft purchase
      description: "Stock IN for every line and supplier ledger credit, atomically.\
        \ Idempotent. Errors: PURCHASE_INVALID_STATUS."
      operationId: post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseResponse"
      security:
      - bearerAuth: []
  /api/v1/purchases/{id}/payments:
    post:
      tags:
      - Purchases
      summary: Record a payment to the supplier
      description: Debits the supplier ledger. Cannot exceed the balance due.
      operationId: pay
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePaymentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseResponse"
      security:
      - bearerAuth: []
  /api/v1/purchases/{id}/cancel:
    post:
      tags:
      - Purchases
      summary: Cancel a draft purchase
      description: "Posted purchases cannot be cancelled; use a purchase return. Errors:\
        \ PURCHASE_INVALID_STATUS."
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseResponse"
      security:
      - bearerAuth: []
  /api/v1/purchase-returns:
    get:
      tags:
      - Purchases
      summary: List purchase returns
      operationId: listReturns
      parameters:
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - POSTED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListPurchaseReturnResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Purchases
      summary: Create a purchase return
      description: "Quantities cannot exceed what remains unreturned. Set post=true\
        \ to post immediately. Errors: RETURN_INVALID_QUANTITY."
      operationId: createReturn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseReturnRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseReturnResponse"
      security:
      - bearerAuth: []
  /api/v1/purchase-returns/{id}/post:
    post:
      tags:
      - Purchases
      summary: Post a purchase return
      description: "Stock OUT and supplier ledger debit, atomically. Idempotent."
      operationId: postReturn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePurchaseReturnResponse"
      security:
      - bearerAuth: []
  /api/v1/products:
    get:
      tags:
      - Products
      summary: Search products
      description: "Search by name, SKU or HSN; filter by category, active and featured.\
        \ Sort: name, sku, sellingPrice, createdAt."
      operationId: list_4
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListProductResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Products
      summary: Create a product
      description: SKU is generated when omitted. Opening stock is posted as an OPENING
        stock movement. GST rate must be an allowed rate.
      operationId: create_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
      security:
      - bearerAuth: []
  /api/v1/products/{id}/images:
    post:
      tags:
      - Products
      summary: Upload a product image
      description: "PNG, JPEG or WebP up to 5 MB; at most 8 images per product."
      operationId: addImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseImageResponse"
      security:
      - bearerAuth: []
  /api/v1/products/{id}/images/{imageId}/primary:
    post:
      tags:
      - Products
      summary: Make an image the primary image
      operationId: setPrimary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
      security:
      - bearerAuth: []
  /api/v1/products/{id}/deactivate:
    post:
      tags:
      - Products
      summary: Deactivate a product
      description: Inactive products are hidden from the catalog and cannot be ordered.
      operationId: deactivate_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
      security:
      - bearerAuth: []
  /api/v1/products/{id}/activate:
    post:
      tags:
      - Products
      summary: Activate a product
      operationId: activate_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
      security:
      - bearerAuth: []
  /api/v1/payments:
    get:
      tags:
      - Payments
      summary: List payments
      description: "Customers see only their own. Filter by customer, method, status\
        \ and date range. Sort: createdAt, amount, paidAt."
      operationId: list_5
      parameters:
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: method
        in: query
        required: false
        schema:
          type: string
          enum:
          - CASH
          - ONLINE
          - UPI
          - BANK_TRANSFER
          - CREDIT
          - OTHER
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNPAID
          - PENDING
          - AUTHORIZED
          - CAPTURED
          - PARTIALLY_PAID
          - FAILED
          - REFUNDED
          - CANCELLED
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListPaymentResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Payments
      summary: Record a payment
      description: "Cash, UPI, bank transfer or other. Applied to invoiceId when given,\
        \ otherwise to the oldest open invoices; any remainder is a customer advance.\
        \ Posts the customer ledger. Send Idempotency-Key for safe retries. Errors:\
        \ PAYMENT_INVALID_AMOUNT, INVOICE_INVALID_STATUS."
      operationId: record
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentResponse"
      security:
      - bearerAuth: []
  /api/v1/payments/{id}/verify:
    post:
      tags:
      - Payments
      summary: Submit the client checkout result
      description: Verifies the provider signature server-side. The payment is marked
