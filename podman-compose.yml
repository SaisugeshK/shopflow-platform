# Local environment for Podman (podman compose / podman-compose). Also works with any Compose-spec runtime.
#   cp .env.example .env   # then edit secrets
#   podman compose up --build
# Web: http://localhost:8081   API: http://localhost:8080   Postgres: localhost:5433
name: shopflow-platform

services:
  database:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopflow} -d shopflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: jdbc:postgresql://database:5432/shopflow
      DATABASE_USERNAME: ${POSTGRES_USER:-shopflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?set OTP_HASH_SECRET in .env}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?set WHATSAPP_WEBHOOK_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      STORAGE_LOCAL_ROOT: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - file-storage:/data/storage

  web:
    build:
      context: ./web
      dockerfile: Containerfile
    depends_on:
      - backend
    ports:
      - "8081:8080"

volumes:
  db-data:
  file-storage:
