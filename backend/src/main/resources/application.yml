spring:
  application:
    name: shopflow-backend
  # Local, git-ignored overrides (e.g. DATABASE_PASSWORD). Real environment variables still win.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shopflow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.shopflow: INFO

app:
  env: ${APP_ENV:dev}
  business:
    # Tenant #1 (seeded by V7, tenant code "main"). Used only as the dev seed target.
    default-business-id: ${BUSINESS_ID:00000000-0000-0000-0000-000000000001}
  tenancy:
    # Comma-separated mobile numbers that become platform SUPER_ADMINs at startup (§0B.5).
    super-admin-mobiles: ${PLATFORM_SUPER_ADMIN_MOBILES:}
    # A new number signing in without a join link registers as a customer of this tenant; blank = join link required.
    default-tenant-code: ${DEFAULT_TENANT_CODE:main}
  security:
    jwt-access-secret: ${JWT_ACCESS_SECRET:}
    jwt-refresh-secret: ${JWT_REFRESH_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    registration-token-ttl: PT30M
    issuer: shopflow-platform
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  otp:
    provider: ${OTP_PROVIDER:mock}
    length: 6
    ttl: PT5M
    max-attempts: 5
    resend-cooldown: PT30S
    max-requests-per-mobile: 5
    max-requests-per-mobile-window: PT15M
    max-requests-per-ip: 30
    # Demo only: return the OTP in the /otp/request response so the login screen can show it.
    # Allowed only with the mock provider (startup fails otherwise). Turn off before real customers use the app.
    show-in-response: ${OTP_SHOW_IN_RESPONSE:false}
    max-requests-per-ip-window: PT1H
    hash-secret: ${OTP_HASH_SECRET:}
    provider-url: ${OTP_PROVIDER_URL:}
    provider-key: ${OTP_PROVIDER_KEY:}
    provider-timeout: PT10S
  auth:
    # ALLOW_LIMITED: pending customers can sign in and see their registration status only.
    # REJECT: pending customers cannot sign in until approved.
    pending-customer-login: ALLOW_LIMITED
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    provider-url: ${PAYMENT_PROVIDER_URL:}
    provider-key: ${PAYMENT_PROVIDER_KEY:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    provider-timeout: PT15S
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}
    provider-url: ${WHATSAPP_PROVIDER_URL:}
    provider-token: ${WHATSAPP_PROVIDER_TOKEN:}
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
    max-retries: 5
    retry-base-delay: PT30S
    provider-timeout: PT15S
    # Recipient numbers ending with this suffix fail in the mock provider (test hook).
    mock-failure-suffix: "9999"
  einvoice:
    provider: ${EINVOICE_PROVIDER:mock}
    enabled: ${EINVOICE_ENABLED:false}
  storage:
    # local (dev/Podman) or gcs (production, GcsStorageProvider — credentials come from the runtime's Application
    # Default Credentials, e.g. the Cloud Run service identity; no access/secret keys are used for gcs).
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/storage}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    gcs-project: ${GCS_PROJECT_ID:}
  dev-tools:
    # Exposes /api/v1/dev/** helpers (latest mock OTP, mock gateway simulation). Never enable in production.
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
    # Dev databases already ran the V9000 seed before V8 (multi-tenancy) existed.
    out-of-order: true
app:
  tenancy:
    super-admin-mobiles: ${PLATFORM_SUPER_ADMIN_MOBILES:+919000000009}
  security:
    jwt-access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-0123456789abcdef}
    jwt-refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-0123456789abcdef}
    refresh-cookie-secure: false
    # 5173 = web (Vite), 8081 = mobile app running in a browser (Expo web). Native apps send no Origin header.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  otp:
    hash-secret: ${OTP_HASH_SECRET:dev-only-otp-hash-secret-change-me}
    show-in-response: ${OTP_SHOW_IN_RESPONSE:true}
    # Development only: the end-to-end suites sign the demo users in many times in a row.
    max-requests-per-mobile: 40
    max-requests-per-ip: 1000
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-payment-webhook-secret}
  whatsapp:
    webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:dev-only-whatsapp-webhook-secret}
  dev-tools:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  dev-tools:
    enabled: false
# Cloud Run (GCP) deployment notes — no defaults are set here; every value below must come from the environment
# (Secret Manager or --set-env-vars), so a misconfigured prod deploy fails fast instead of falling back silently:
#   DATABASE_URL      jdbc:postgresql:///<db>?cloudSqlInstance=<project>:<region>:<instance>&socketFactory=com.google.cloud.sql.postgres.SocketFactory
#   STORAGE_PROVIDER  gcs
#   OBJECT_STORAGE_BUCKET   the private GCS bucket name
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, OTP_HASH_SECRET, PAYMENT_WEBHOOK_SECRET, WHATSAPP_WEBHOOK_SECRET,
#   DATABASE_PASSWORD  from Secret Manager (--set-secrets), never baked into the image
#   CORS_ALLOWED_ORIGINS  the deployed app's own https URL is enough once the frontend is served from the same
#                          origin (see the single-image Containerfile); CORS is not needed for same-origin requests
